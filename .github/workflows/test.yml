name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning setup.sh install.sh tf2vr-frame-launch lib/apply-launch-options.sh tests/test_launch.sh
      - name: unit tests
        run: python3 -m unittest discover -s tests -v
      - name: launch wrapper
        run: bash tests/test_launch.sh
      - name: setup_progress.exe matches its source
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 >/dev/null
          x86_64-w64-mingw32-gcc -O2 -s -municode -Wall -Wl,--no-insert-timestamp -o /tmp/setup_progress.exe tools/setup_progress/setup_progress.c
          cmp /tmp/setup_progress.exe lib/setup_progress.exe || { echo "lib/setup_progress.exe isn't the build of tools/setup_progress/setup_progress.c - rebuild it with the command above"; exit 1; }
